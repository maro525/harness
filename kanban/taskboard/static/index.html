<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128203;</text></svg>">
</head>
<body>
<header class="bar">
  <h1>Task Board</h1>
  <nav id="tabs" class="tabs" hidden>
    <a href="#/board" data-view="board">Board</a>
    <a href="#/agents" data-view="agents">Agents <span id="unreadBadge" class="badge" hidden></span></a>
    <a href="#/timeline" data-view="timeline">Timeline</a>
  </nav>
  <span class="controls" data-for="board">
    <input id="q" type="search" placeholder="Search title, id, branch, question…" autocomplete="off" spellcheck="false">
    <select id="project"><option value="">All projects</option></select>
    <select id="tier"><option value="">All tiers</option></select>
    <label class="toggle"><input type="checkbox" id="staleOnly"> Stale status only</label>
    <label class="toggle"><input type="checkbox" id="askOnly"> Waiting questions only</label>
  </span>
  <span class="controls" data-for="agents" hidden>
    <input id="agentQ" type="search" placeholder="Search agent, model, repo…" autocomplete="off" spellcheck="false">
    <select id="agentRepo"><option value="">All repos</option></select>
    <label class="toggle"><input type="checkbox" id="liveOnly"> Live only</label>
    <label class="toggle"><input type="checkbox" id="allEnded"> Ended older than 24h</label>
  </span>
  <span class="controls" data-for="timeline" hidden>
    <input id="timeQ" type="search" placeholder="Search events…" autocomplete="off" spellcheck="false">
    <select id="timeBoss"><option value="">All bosses</option></select>
    <select id="timeRepo"><option value="">All repos</option></select>
    <span id="timeKinds" class="kinds">
      <label class="toggle"><input type="checkbox" value="delegate" checked> Delegate</label>
      <label class="toggle"><input type="checkbox" value="report" checked> Report</label>
      <label class="toggle"><input type="checkbox" value="attention" checked> Question / blocked</label>
      <label class="toggle"><input type="checkbox" value="lock" checked> Lock</label>
      <label class="toggle"><input type="checkbox" value="phase" checked> Phase</label>
    </span>
  </span>
  <span class="spacer"></span>
  <span id="herdrStatus" class="status" hidden></span>
  <span id="status" class="status" title="Connection state">connecting…</span>
</header>

<div class="layout">
  <div class="views">
    <main id="board" class="board view" data-view="board" aria-live="polite"></main>
    <main id="agents" class="agents view" data-view="agents" hidden></main>
    <main id="timeline" class="timeline view" data-view="timeline" hidden></main>
    <div id="empty" class="empty" hidden>
      <p>No tasks match the current filters.</p>
    </div>
  </div>
  <aside id="detail" class="detail" hidden aria-label="Details">
    <button id="detailClose" class="close" title="Close" aria-label="Close">×</button>
    <div id="detailBody"></div>
  </aside>
</div>

<template id="cardTpl"></template>
<script src="/app.js"></script>
<script src="/activity.js"></script>
</body>
</html>
