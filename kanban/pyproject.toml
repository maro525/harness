[project]
name = "taskboard"
version = "0.1.0"
description = "Read-only kanban board over TASK_FILE markdown documents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
taskboard = "taskboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskboard"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
